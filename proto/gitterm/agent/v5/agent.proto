syntax = "proto3";

package gitterm.agent.v5;

service GitTermAgent {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileChunk);
  rpc GitStatus(GitStatusRequest) returns (GitStatusResponse);
  rpc GitDiff(GitDiffRequest) returns (GitDiffResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartSession(StartSessionRequest) returns (Session);
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
  rpc AttachTerminal(stream TerminalInput) returns (stream TerminalOutput);
  // Chats index (TRU-78): the agent scans its own harness transcript
  // stores (claude/codex/pi) with the same code the desktop uses locally.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc ChatPreview(ChatPreviewRequest) returns (ChatPreviewResponse);
  // Native Claude chat (TRU-152), capability "claude_chat". With
  // capability "claude_chat_persistent" the agent owns each chat's
  // `claude` process: a stream only attaches to it, and ending the stream
  // detaches. Before that capability the process lived as long as the
  // stream.
  rpc ClaudeChat(stream ClaudeChatClientMessage) returns (stream ClaudeChatServerMessage);
  // A Claude session's transcript, parsed into the chat timeline.
  rpc ClaudeChatHistory(ClaudeChatHistoryRequest) returns (ClaudeChatHistoryResponse);
  // The Claude chats the agent is running (capability
  // "claude_chat_persistent").
  rpc ListClaudeChats(ListClaudeChatsRequest) returns (ListClaudeChatsResponse);
  // Phone access (TRU-151), capability "phone": the agent serves a small
  // web app on its phone address. A pairing is a one-time code a phone
  // redeems there for a device token.
  rpc CreatePhonePairing(CreatePhonePairingRequest) returns (CreatePhonePairingResponse);
  rpc ListPhones(ListPhonesRequest) returns (ListPhonesResponse);
  // Forget a paired phone: its token stops working and its open sockets
  // close at once.
  rpc RevokePhone(RevokePhoneRequest) returns (RevokePhoneResponse);
}

message HandshakeRequest {
  string client_name = 1;
  string client_version = 2;
  uint32 protocol_version = 3;
}

message HandshakeResponse {
  string agent_name = 1;
  string agent_version = 2;
  uint32 protocol_version = 3;
  repeated string capabilities = 4;
  // The agent user's $HOME, so pickers can start there. Empty from agents
  // that predate it.
  string home_dir = 5;
}

message ListDirRequest {
  string workspace_id = 1;
  string root = 2;
  string current_dir = 3;
  bool show_hidden = 4;
}

message ListDirResponse {
  string workspace_id = 1;
  string root = 2;
  string current_dir = 3;
  repeated DirEntry entries = 4;
}

message DirEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  // Directory contains a `.git` entry (file or dir). False from agents
  // that predate it.
  bool is_git_repo = 4;
}

message ReadFileRequest {
  string workspace_id = 1;
  string root = 2;
  string path = 3;
  // Stop streaming after this many bytes; 0 means the agent default cap.
  uint64 max_bytes = 4;
}

message ReadFileChunk {
  bytes data = 1;
  // Full size of the file on disk, independent of max_bytes.
  uint64 total_size = 2;
  // True when the stream stops before total_size due to max_bytes.
  bool truncated = 3;
}

message GitStatusRequest {
  string workspace_id = 1;
  string root = 2;
}

message GitStatusResponse {
  string workspace_id = 1;
  // Canonical repo root actually used (self-healed to the toplevel).
  string root = 2;
  bool is_git_repo = 3;
  string repo_name = 4;
  string branch_name = 5;
  repeated GitFileStatus staged = 6;
  repeated GitFileStatus unstaged = 7;
  repeated GitFileStatus untracked = 8;
}

message GitFileStatus {
  // Repo-relative path.
  string path = 1;
  // Single-letter porcelain status: A/M/D/R/?.
  string status = 2;
  bool is_staged = 3;
}

message GitDiffRequest {
  string workspace_id = 1;
  string root = 2;
  // Repo-relative path from GitStatusResponse; absolute or parent-escaping
  // paths are rejected.
  string file_path = 3;
  bool staged = 4;
}

message GitDiffResponse {
  string workspace_id = 1;
  string file_path = 2;
  bool staged = 3;
  repeated GitDiffLine lines = 4;
}

enum GitDiffLineKind {
  GIT_DIFF_LINE_KIND_UNSPECIFIED = 0;
  GIT_DIFF_LINE_KIND_CONTEXT = 1;
  GIT_DIFF_LINE_KIND_ADDITION = 2;
  GIT_DIFF_LINE_KIND_DELETION = 3;
  GIT_DIFF_LINE_KIND_HEADER = 4;
}

message GitDiffLine {
  string content = 1;
  GitDiffLineKind kind = 2;
  // 1-based; 0 means the line doesn't exist on that side.
  uint32 old_line = 3;
  uint32 new_line = 4;
}

message ListSessionsRequest {
  string workspace_id = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message Session {
  // Opaque stable id assigned by the agent.
  string session_id = 1;
  string workspace_id = 2;
  // shell | claude | codex | pi | custom — a label, not behavior.
  string kind = 3;
  string command = 4;
  string cwd = 5;
  bool running = 6;
  int32 exit_code = 7;
  uint64 created_unix_secs = 8;
}

message StartSessionRequest {
  string workspace_id = 1;
  // Working directory; must resolve under the agent's filesystem like any
  // other path (absolute, existing directory).
  string cwd = 2;
  string kind = 3;
  // argv; argv[0] is the program. Never shell-interpolated.
  repeated string command = 4;
  repeated EnvVar env = 5;
  uint32 cols = 6;
  uint32 rows = 7;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message StopSessionRequest {
  string session_id = 1;
}

message StopSessionResponse {
  bool stopped = 1;
}

message TerminalInput {
  oneof input {
    AttachRequest attach = 1;
    bytes data = 2;
    Resize resize = 3;
  }
}

message AttachRequest {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalOutput {
  oneof output {
    bytes data = 1;
    SessionExited exited = 2;
  }
}

message SessionExited {
  int32 exit_code = 1;
}

message ListChatsRequest {}

message ChatEntry {
  string id = 1;
  // "claude" | "codex" | "pi"
  string backend = 2;
  // Transcript path on the agent's machine (opaque to the desktop).
  string path = 3;
  string cwd = 4;
  // Empty when unknown (dead cwd / not a git repo).
  string repo_root = 5;
  bool is_worktree = 6;
  // Empty when unknown.
  string branch = 7;
  string title = 8;
  int64 mtime_unix_secs = 9;
  uint64 size_bytes = 10;
  bool dead_cwd = 11;
}

message ListChatsResponse {
  repeated ChatEntry chats = 1;
}

message ChatPreviewRequest {
  // Path previously returned by ListChats; must stay under the agent
  // user's home directory.
  string path = 1;
  string backend = 2;
}

message ChatPreviewMessage {
  bool is_user = 1;
  string text = 2;
}

message ChatPreviewResponse {
  repeated ChatPreviewMessage messages = 1;
  optional uint64 message_count = 2;
}

message ClaudeChatClientMessage {
  oneof message {
    // First message only: the session config as JSON (cwd, model,
    // permission_mode, effort, resume, chrome). With
    // "claude_chat_persistent", a resume id naming a running chat attaches
    // to it instead of starting a second process.
    string start_json = 1;
    // Every later message: one harness command as JSON.
    string command_json = 2;
    // First message only, instead of start_json, from a client that knows
    // "claude_chat_persistent": attach to a running chat or start one. The
    // agent answers with `opened` before anything else.
    ClaudeChatAttach attach = 3;
  }
}

message ClaudeChatAttach {
  // A chat id from an earlier `opened`: attach to that chat, NOT_FOUND when
  // it is no longer running. Empty: start from start_json, which attaches
  // instead when its resume id names a running chat.
  string chat_id = 1;
  // Replay every buffered event after this seq (the last one this client
  // saw of the chat). Unset: no replay; the client reads the history
  // itself (ClaudeChatHistory) and continues from live events.
  optional uint64 after_seq = 2;
  // The start config JSON, as in start_json. Required when chat_id is empty.
  string start_json = 3;
}

message ClaudeChatServerMessage {
  // One harness event as JSON. Empty on an `opened` message.
  string event_json = 1;
  // Agents with "claude_chat_persistent": the event's place in its chat,
  // from 1 and increasing by 1 per relayed event. 0 on `opened` and on
  // notices meant only for this stream (an undecodable command).
  uint64 seq = 2;
  // The first message of an `attach` stream; nothing else is set on it.
  ClaudeChatOpened opened = 3;
  // An event this stream's position already covers, sent again because it
  // is still in force: the session's ready / mode / model / effort, the
  // running turn's start, or an unanswered runtime request (so it can be
  // answered).
  bool redelivered = 4;
}

message ClaudeChatOpened {
  string chat_id = 1;
  // True when the stream joined a chat that was already running (no new
  // process was started).
  bool attached = 2;
  // Empty until Claude reports it.
  string claude_session_id = 3;
  // The last seq assigned before this stream attached. Live events follow
  // it; replayed ones (after_seq < seq <= head_seq) come first.
  uint64 head_seq = 4;
  // after_seq was set, but events after it are no longer buffered: nothing
  // is replayed, the client reloads the history and continues from
  // head_seq. Redelivered state still follows.
  bool gap = 5;
}

message ClaudeChatHistoryRequest {
  string session_id = 1;
}

message ListClaudeChatsRequest {}

message ListClaudeChatsResponse {
  repeated ClaudeChatInfo chats = 1;
}

enum ClaudeChatState {
  CLAUDE_CHAT_STATE_UNSPECIFIED = 0;
  // No turn running and nothing awaiting the human.
  CLAUDE_CHAT_STATE_IDLE = 1;
  CLAUDE_CHAT_STATE_TURN_RUNNING = 2;
  // A runtime request (permission prompt, question) is unanswered.
  CLAUDE_CHAT_STATE_AWAITING_INPUT = 3;
}

message ClaudeChatInfo {
  string chat_id = 1;
  // Empty until Claude reports it.
  string claude_session_id = 2;
  string cwd = 3;
  ClaudeChatState state = 4;
  uint64 created_unix_secs = 5;
  uint64 last_activity_unix_secs = 6;
  uint32 attached_clients = 7;
}

message ClaudeChatHistoryResponse {
  // The transcript's timeline entries as a JSON array. A session with no
  // transcript on the agent's machine is NOT_FOUND instead.
  string timeline_json = 1;
}

message CreatePhonePairingRequest {
  // Shown in the paired-phones list ("Tracey's iPhone").
  string device_name = 1;
  // "view" or "act" (empty: "view"). The agent may grant less than asked;
  // the response says what the phone will get.
  string scope = 2;
}

message CreatePhonePairingResponse {
  // Single use; expires at expires_unix_secs.
  string code = 1;
  // http://<phone host:port>/pair#<code>: the code rides in the fragment,
  // which browsers never send to a server or proxy.
  string pairing_url = 2;
  uint64 expires_unix_secs = 3;
  // The scope the phone is granted when it pairs.
  string scope = 4;
}

message ListPhonesRequest {}

message PairedPhone {
  string id = 1;
  string name = 2;
  // "view" | "act"
  string scope = 3;
  uint64 created_unix_secs = 4;
  // 0: never used since pairing.
  uint64 last_seen_unix_secs = 5;
}

message ListPhonesResponse {
  repeated PairedPhone phones = 1;
}

message RevokePhoneRequest {
  string id = 1;
}

message RevokePhoneResponse {
  // False when no phone had the id.
  bool revoked = 1;
}
