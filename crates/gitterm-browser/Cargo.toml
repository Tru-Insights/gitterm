[package]
name = "gitterm-browser"
version = "0.1.0"
edition = "2021"
description = "GitTerm's managed browser controller, agent-browser engine and browser MCP server"

[dependencies]
gitterm-core = { path = "../gitterm-core", features = ["runtime"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
base64 = "0.22"
futures-util = "0.3"
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "macros", "net", "time"] }
tokio-util = "0.7"
tokio-tungstenite = "0.21"
axum = "0.8"
rmcp = { version = "2.2", features = ["server", "transport-streamable-http-server"] }
# PNG decoding for the pixel diff's changed regions (agent_browser.rs).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "2.2", features = ["client", "transport-streamable-http-client-reqwest"] }
