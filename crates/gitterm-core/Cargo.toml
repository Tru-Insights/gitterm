[package]
name = "gitterm-core"
version = "0.1.0"
edition = "2021"
description = "Plain workspace and Git status types and workspace ordering for GitTerm"

[features]
default = []
runtime = ["dep:tokio", "dep:git2"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", optional = true, features = ["rt", "sync"] }
git2 = { version = "0.19", optional = true }

chrono = "0.4"
schemars = "1.0"

[dev-dependencies]
tempfile = "3"
