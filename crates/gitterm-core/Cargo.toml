[package]
name = "gitterm-core"
version = "0.1.0"
edition = "2021"
description = "Plain workspace and Git status types and workspace ordering for GitTerm"

[features]
default = []
runtime = ["dep:ring", "dep:tokio-util", "dep:tokio", "dep:git2", "dep:libc", "dep:warp", "dep:dirs"]

excalidraw = []

# The Iced host retains its exact TOML parser pin. GPUI has an incompatible
# transitive TOML requirement; it does not activate Codex trust yet.
codex-trust = ["runtime", "dep:toml"]

[dependencies]
ring = { version = "0.17", optional = true }
tokio-util = { version = "0.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
schemars = "1.0"
libc = { version = "0.2", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "process", "io-util", "time", "macros", "fs"] }
git2 = { version = "0.19", optional = true }
dirs = { version = "5.0", optional = true }

pulldown-cmark = "0.12"
warp = { version = "0.3", optional = true }

# Preserve the root trust parser/quoting versions.
toml = { version = "=0.8.2", optional = true }
shell-words = "=1.1.1"

[dev-dependencies]
toml = "=0.8.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
