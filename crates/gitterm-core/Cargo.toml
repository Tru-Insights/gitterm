[package]
name = "gitterm-core"
version = "0.1.0"
edition = "2021"
description = "Plain workspace and Git status types and workspace ordering for GitTerm"

[features]
default = []
runtime = ["dep:tokio-util", "dep:tokio", "dep:git2", "dep:warp", "dep:dirs", "dep:tonic", "dep:prost", "dep:tokio-stream", "dep:tonic-build", "dep:protoc-bin-vendored", "dep:axum", "dep:rmcp"]

excalidraw = []

# Codex trust parsing. The root workspace pins toml =0.8.2 in its own
# Cargo.toml; GPUI resolves a later 0.8.x (its transitive requirement), and
# the trust tests run under both (gpui/crates/shell/tests/codex_trust.rs).
codex-trust = ["runtime", "dep:toml"]

[dependencies]
tokio-util = { version = "0.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1.0"
libc = "0.2"
tokio = { version = "1", optional = true, features = ["rt", "sync", "process", "io-util", "time", "macros", "fs", "net"] }
git2 = { version = "0.19", optional = true }
dirs = { version = "5.0", optional = true }

pulldown-cmark = "0.12"
warp = { version = "0.3", optional = true }

# Root pins the exact toml in its Cargo.toml; quoting stays pinned here.
toml = { version = "0.8", optional = true }
shell-words = "=1.1.1"

ring = "0.17"

tonic = { version = "0.12", features = ["transport", "tls-roots"], optional = true }
prost = { version = "0.13", optional = true }
tokio-stream = { version = "=0.1.18", features = ["net"], optional = true }

# The task MCP server (task_mcp.rs); the versions the root crate uses.
axum = { version = "0.8", optional = true }
rmcp = { version = "2.2", optional = true, features = ["server", "transport-streamable-http-server"] }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protoc-bin-vendored = { version = "=3.2.0", optional = true }

[dev-dependencies]
toml = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rmcp = { version = "2.2", features = ["client", "transport-streamable-http-client-reqwest"] }
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }

# Shared with gpui/crates/shell/tests/codex_trust.rs: one set of trust cases
# run under each workspace's resolved toml.
[[test]]
name = "codex_trust"
required-features = ["codex-trust"]
