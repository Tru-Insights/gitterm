[package]
name = "gitterm-core"
version = "0.1.0"
edition = "2021"
description = "Plain workspace and Git status types and workspace ordering for GitTerm"

[features]
default = []
runtime = ["dep:tokio-util", "dep:tokio", "dep:git2", "dep:libc", "dep:warp", "dep:dirs", "dep:tonic", "dep:prost", "dep:tokio-stream", "dep:tonic-build", "dep:protoc-bin-vendored"]

excalidraw = []

# The Iced host retains its exact TOML parser pin. GPUI has an incompatible
# transitive TOML requirement; it does not activate Codex trust yet.
codex-trust = ["runtime", "dep:toml"]

[dependencies]
tokio-util = { version = "0.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1.0"
libc = { version = "0.2", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "process", "io-util", "time", "macros", "fs"] }
git2 = { version = "0.19", optional = true }
dirs = { version = "5.0", optional = true }

pulldown-cmark = "0.12"
warp = { version = "0.3", optional = true }

# Preserve the root trust parser/quoting versions.
toml = { version = "=0.8.2", optional = true }
shell-words = "=1.1.1"

ring = "0.17"

tonic = { version = "0.12", features = ["transport", "tls-roots"], optional = true }
prost = { version = "0.13", optional = true }
tokio-stream = { version = "=0.1.18", features = ["net"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protoc-bin-vendored = { version = "=3.2.0", optional = true }

[dev-dependencies]
toml = "=0.8.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
