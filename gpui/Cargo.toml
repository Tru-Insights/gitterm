[package]
name = "gitterm-gpui"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "GitTerm GPUI stage 0 build and packaging gate"

[workspace]
members = ["crates/chat"]
resolver = "3"

[target.'cfg(target_os = "macos")'.dependencies]
gitterm-gpui-chat = { path = "crates/chat" }
gpui-component = { version = "=0.9.1", features = ["syntect"] }
gpui-webview = "=0.9.1"
gpui_xterm = "=0.3.0"
gpui-kit = "=0.9.1"
gpui-pre = "=0.3.12"
