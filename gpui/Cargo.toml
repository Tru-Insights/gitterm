[package]
name = "gitterm-gpui"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "GitTerm GPUI desktop preview"

[workspace]
resolver = "3"
members = ["crates/chat", "crates/review", "crates/shell", "crates/terminal"]
default-members = [".", "crates/chat", "crates/review", "crates/shell", "crates/terminal"]

[dependencies]
gitterm-core = { path = "../crates/gitterm-core", features = ["runtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
gitterm-gpui-review = { path = "crates/review" }
gitterm-gpui-chat = { path = "crates/chat" }
gitterm-gpui-shell = { path = "crates/shell" }
gpui-component = { version = "=0.11.0", features = ["syntect"] }
gpui-kit = "=0.11.0"
gpui-pre = "=0.3.14"

gitterm-terminal = { path = "crates/terminal" }

[profile.dev]
debug = 0

[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3
