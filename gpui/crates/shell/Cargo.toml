[package]
name = "gitterm-gpui-shell"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
excalidraw = ["gitterm-core/excalidraw"]

[target.'cfg(target_os = "macos")'.dependencies]
gitterm-core = { path = "../../../crates/gitterm-core", features = ["runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
gitterm-terminal = { path = "../terminal" }
gitterm-gpui-review = { path = "../review" }
gitterm-gpui-chat = { path = "../chat" }
gpui-kit = "=0.9.1"
gpui-component = "=0.9.1"
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKSnapshotConfiguration", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_test = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-component = { version = "=0.9.1", features = ["test-support"] }
