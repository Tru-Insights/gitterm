[package]
name = "gitterm-gpui-shell"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
excalidraw = ["gitterm-core/excalidraw"]

[target.'cfg(target_os = "macos")'.dependencies]
gitterm-core = { path = "../../../crates/gitterm-core", features = ["runtime", "codex-trust"] }
gitterm-browser = { path = "../../../crates/gitterm-browser" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
# The phone list request (`list_phones`); the same tonic core builds its client with.
tonic = { version = "0.12", default-features = false }
gitterm-terminal = { path = "../terminal" }
gitterm-gpui-review = { path = "../review" }
gitterm-gpui-chat = { path = "../chat" }
gpui-kit = "=0.9.1"
gpui-component = "=0.9.1"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKSnapshotConfiguration", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_test = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-component = { version = "=0.9.1", features = ["test-support"] }
# tests/codex_trust.rs: core's trust cases under this workspace's toml.
git2 = "0.19"
toml = "0.8"
shell-words = "=1.1.1"
