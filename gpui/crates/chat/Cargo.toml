[package]
name = "gitterm-gpui-chat"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
gitterm-core = { path = "../../../crates/gitterm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markdown = "=1.0.0"
# Find matches as Iced's `giu` RegExp: Unicode simple case folding.
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = "=0.11.0"
gpui-component = { version = "=0.11.0", features = ["syntect"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre = { version = "=0.3.14", features = ["test-support"] }
gpui-component = { version = "=0.11.0", features = ["test-support"] }
