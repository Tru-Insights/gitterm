[package]
name = "gitterm-terminal"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[dependencies]
alacritty_terminal = "=0.25.1"
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component"] }
parking_lot = "0.12"
arboard = "3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
polling = "3"
mach2 = "=0.6.0"
