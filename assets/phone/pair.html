<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e1e2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="GitTerm" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="color-scheme" content="dark" />
<title>Pair with GitTerm</title>
<style>
  :root { --bg: #1e1e2e; --bg-alt: #181825; --fg: #cdd6f4; --muted: #7f849c; --accent: #89b4fa; --ok: #a6e3a1; --err: #f38ba8; --border: #45475a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 32px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 20px); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  #status { padding: 14px 16px; border-radius: 12px; background: var(--bg-alt); border: 1px solid var(--border); color: var(--fg); }
  #status.ok { border-color: var(--ok); }
  #status.err { border-color: var(--err); }
  a.button { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 10px; background: var(--accent); color: #11111b; font-weight: 600; text-decoration: none; }
  a.button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Pair with GitTerm</h1>
  <p>This phone gets its own key to view the chats on this machine. GitTerm can revoke it at any time.</p>
  <div id="status">Pairing…</div>
  <a id="open" class="button" href="./" hidden>Open chats</a>
</main>
<script>
(function () {
  'use strict';
  const TOKEN_KEY = 'gitterm.phone.token';
  const statusEl = document.getElementById('status');
  const openEl = document.getElementById('open');
  function show(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }
  // The code rides in the fragment, which is never sent to a server.
  // Drop it from the address bar and history at once.
  const code = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  history.replaceState(null, '', location.pathname + location.search);
  if (!code) {
    show('This link has no pairing code. In GitTerm, open the machine menu and choose “Pair a phone…”, then scan the new code.', 'err');
    if (localStorage.getItem(TOKEN_KEY)) openEl.hidden = false;
    return;
  }
  fetch('api/pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code }),
    cache: 'no-store',
  }).then(async (response) => {
    let body = null;
    try { body = await response.json(); } catch (e) { console.error('pair: unreadable response', e); }
    if (!response.ok || !body || !body.token) {
      const why = (body && body.error) || ('the agent answered ' + response.status);
      show('Could not pair: ' + why, 'err');
      return;
    }
    localStorage.setItem(TOKEN_KEY, body.token);
    const phone = body.phone || {};
    const scope = phone.scope === 'view' ? ' (view only)' : '';
    show('Paired with ' + (body.agent || 'GitTerm') + ' as “' + (phone.name || 'this phone') + '”' + scope + '.', 'ok');
    openEl.hidden = false;
    setTimeout(() => location.replace('./'), 1200);
  }).catch((e) => {
    console.error('pair failed', e);
    show('Could not reach the agent: ' + e, 'err');
  });
})();
</script>
</body>
</html>
