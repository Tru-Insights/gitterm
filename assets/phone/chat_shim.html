<script>
// Phone transport for the chat page (TRU-151). The desktop feeds this page
// from Rust through wry; on a phone the same entry points
// (__resetConversation / __replay / __appendEvent) are fed from the
// agent's socket (a running chat) or its history API (a past one).
// The host bridge (window.ipc) opens links, and for a phone paired to act
// on a live chat it carries the page's send, answer and stop over the
// socket; every other page action is dropped. The agent refuses anything
// a view-only phone sends anyway, and everything but those three from any
// phone.
(function () {
  'use strict';
  const TOKEN_KEY = 'gitterm.phone.token';
  const params = new URLSearchParams(location.search);
  const chatId = params.get('chat') || '';
  let sessionId = params.get('session') || '';
  const title = params.get('title') || '';

  // ---- top bar -------------------------------------------------------------
  const bar = document.createElement('div');
  bar.id = 'phone-bar';
  const back = bar.appendChild(document.createElement('a'));
  back.href = './';
  back.textContent = '‹ Chats';
  const titleEl = bar.appendChild(document.createElement('div'));
  titleEl.id = 'phone-title';
  titleEl.textContent = title || 'Chat';
  const stateEl = bar.appendChild(document.createElement('span'));
  stateEl.id = 'phone-state';
  document.body.insertBefore(bar, document.body.firstChild);
  document.title = title || 'Chat';
  function state(text, cls) {
    stateEl.textContent = text;
    stateEl.className = cls || '';
  }

  // ---- host bridge ---------------------------------------------------------
  let socket = null;
  let actScope = false;   // the socket's `opened` said this phone may act
  function canAct() {
    return actScope && socket != null && socket.readyState === WebSocket.OPEN;
  }
  // Show the composer and prompt answers only while the phone can act.
  function refreshAct() {
    document.body.classList.toggle('phone-act', canAct());
  }
  // A message id the agent accepts (a UUID). crypto.randomUUID needs a
  // secure context, which a plain-HTTP tailnet page is not.
  function newMessageId() {
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  function sendCommand(command) {
    socket.send(JSON.stringify(command));
  }
  function sendPrompt(message) {
    const text = typeof message.text === 'string' ? message.text : '';
    if (Array.isArray(message.images) && message.images.length) {
      fail('Images cannot be sent from a phone; the message was not sent.');
      return;
    }
    if (!text.trim()) return;
    const id = newMessageId();
    // The local echo; the agent's echo of the same id is then skipped.
    window.__appendEvent({ kind: 'harness', event: { type: 'user_message_echo', data: { id, text, image_count: 0 } } });
    try {
      sendCommand({ type: 'send', id, text });
    } catch (e) {
      console.error('phone: could not send a message', e);
      window.__markPromptUnsent(id, 'the connection dropped');
    }
  }
  window.ipc = {
    postMessage(raw) {
      let message = null;
      try { message = JSON.parse(raw); } catch (e) { console.error('phone: bad page message', e); return; }
      if (message.type === 'open_url' && /^https?:/i.test(message.url || '')) {
        window.open(message.url, '_blank', 'noopener,noreferrer');
        return;
      }
      if (message.type === 'hostkey') return;
      const command = { submit: 'send', answer: 'answer', stop: 'interrupt' }[message.type];
      if (!command) {
        console.warn('phone: "' + message.type + '" is not sent from a phone');
        return;
      }
      if (!canAct()) {
        console.warn('phone: "' + message.type + '" is not sent: ' + (actScope ? 'not connected' : 'this phone can only view'));
        if (actScope) fail('Not connected to the chat; nothing was sent.');
        return;
      }
      try {
        if (command === 'send') sendPrompt(message);
        else if (command === 'answer') sendCommand({ type: 'answer', request_id: message.requestId, decision: message.decision });
        else sendCommand({ type: 'interrupt' });
      } catch (e) {
        console.error('phone: could not send ' + command, e);
        fail('Could not send that to the chat: ' + e);
      }
    },
  };
  // Every chat the phone app opens is a Claude chat.
  window.__setTabId(0, 'default', null);
  document.getElementById('prompt').placeholder = 'Message Claude…';
  // No images from a phone: paste and drop of files stop here, before the
  // page's own handlers attach them.
  function hasFiles(transfer) {
    return !!transfer && Array.from(transfer.types || []).includes('Files');
  }
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData ? Array.from(e.clipboardData.items || []) : [];
    if (!items.some((it) => it.kind === 'file')) return;
    e.preventDefault();
    e.stopPropagation();
    console.warn('phone: images cannot be attached from a phone');
  }, true);
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e.dataTransfer)) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    state('Not paired', 'err');
    window.__appendEvent({ kind: 'harness', event: { type: 'error', data: 'This phone is not paired. Pair it from GitTerm (machine menu → Pair a phone…).' } });
    return;
  }

  function showHistory(events) {
    window.__resetConversation();
    window.__replay(Array.isArray(events) ? events : []);
  }
  function fail(text) {
    window.__appendEvent({ kind: 'harness', event: { type: 'error', data: text } });
  }

  // ---- a conversation that is not running -----------------------------------
  async function loadHistory() {
    if (!sessionId) {
      state('Ended', 'warn');
      fail('This chat is no longer running and has no saved conversation to show.');
      return;
    }
    state('Loading…');
    try {
      const response = await fetch('api/history?session=' + encodeURIComponent(sessionId), {
        headers: { Authorization: 'Bearer ' + token },
        cache: 'no-store',
      });
      let body = null;
      try { body = await response.json(); } catch (e) { console.error('history: unreadable response', e); }
      if (response.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        state('Not paired', 'err');
        fail('This phone is no longer paired. Pair it again from GitTerm.');
        return;
      }
      if (!response.ok || !body) {
        state('Error', 'err');
        fail('Could not load this conversation: ' + ((body && body.error) || response.status));
        return;
      }
      showHistory(body.events);
      state('History');
    } catch (e) {
      console.error('history: request failed', e);
      state('Offline', 'err');
      fail('Could not reach the agent: ' + e);
    }
  }

  // ---- a running chat ---------------------------------------------------------
  let lastSeq = null;     // the last seq shown; a reconnect resumes after it
  let finished = false;   // exited / revoked / unpaired: do not reconnect
  let retry = 0;
  let retryTimer = null;

  function connect() {
    if (finished || socket) return;
    clearTimeout(retryTimer);
    const url = new URL('api/ws', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    state(lastSeq == null ? 'Connecting…' : 'Reconnecting…', 'warn');
    const ws = new WebSocket(url.toString());
    socket = ws;
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'hello', token, chat_id: chatId, after_seq: lastSeq }));
    };
    ws.onmessage = (e) => {
      let message = null;
      try { message = JSON.parse(e.data); } catch (err) { console.error('phone: bad socket message', err); return; }
      onMessage(message);
    };
    ws.onclose = () => {
      if (socket === ws) socket = null;
      refreshAct();
      if (finished) return;
      const delay = Math.min(15000, 1000 * Math.pow(2, retry));
      retry += 1;
      state('Reconnecting…', 'warn');
      retryTimer = setTimeout(connect, delay);
    };
    ws.onerror = (e) => console.warn('phone: socket error', e);
  }

  function onMessage(message) {
    switch (message.type) {
      case 'opened':
        retry = 0;
        if (message.claude_session_id) sessionId = message.claude_session_id;
        actScope = message.scope === 'act';
        document.body.classList.toggle('phone-view', !actScope);
        refreshAct();
        state('Live', 'live');
        return;
      case 'history':
        showHistory(message.events);
        return;
      case 'event':
        // On a reconnect, redelivered standing events this page already
        // shows are skipped; seqs never go backwards.
        if (lastSeq != null && message.seq <= lastSeq) return;
        window.__appendEvent(message.event);
        if (!message.redelivered) lastSeq = message.seq;
        else if (lastSeq == null) lastSeq = 0;
        return;
      case 'refused':
      case 'invalid':
      case 'failed': {
        // A message, answer or stop the agent did not pass on.
        // A message's bubble says so itself; anything else gets a line.
        const why = message.message || 'The agent refused that.';
        if (typeof message.id === 'string' && window.__markPromptUnsent(message.id, why)) return;
        fail(why);
        return;
      }
      case 'gap':
        // Fell behind the agent's buffer: reattach; the agent sends the
        // history again.
        state('Catching up…', 'warn');
        return;
      case 'exited':
        finished = true;
        actScope = false;
        refreshAct();
        state('Ended', 'warn');
        return;
      case 'not_running':
        finished = true;
        loadHistory();
        return;
      case 'revoked':
      case 'unauthorized':
        finished = true;
        actScope = false;
        refreshAct();
        localStorage.removeItem(TOKEN_KEY);
        state('Not paired', 'err');
        fail(message.type === 'revoked'
          ? 'This phone was unpaired in GitTerm.'
          : 'This phone is not paired (or was revoked). Pair it again from GitTerm.');
        return;
      case 'error':
        state('Error', 'err');
        fail(message.message || 'The agent closed the connection.');
        return;
      default:
        console.warn('phone: unknown socket message', message.type);
    }
  }

  // iOS drops sockets of backgrounded pages; reconnect when shown again.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && chatId && !finished && !socket) {
      retry = 0;
      connect();
    }
  });

  if (chatId) connect();
  else loadHistory();
})();
</script>
