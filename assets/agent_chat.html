<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gitterm agent chat</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e2e;
    --bg-alt: #181825;
    --bg-block: #313244;
    --bg-input: #181825;
    --fg: #cdd6f4;
    --fg-muted: #7f849c;
    --accent: #89b4fa;
    --border: #45475a;
    --border-strong: #585b70;
    --user: #a6e3a1;
    --result: #94e2d5;
    --tool: #fab387;
    --warn: #f9e2af;
    --err: #f38ba8;
    --thinking: #7f849c;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 14px;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 8px;
  }
  #timeline-wrap { flex: 1; position: relative; min-height: 0; }
  #messages {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    background: var(--bg-alt);
    border-radius: 8px;
    padding: 12px 14px;
    line-height: 1.5;
  }
  #messages::-webkit-scrollbar { width: 10px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  #jump {
    position: absolute;
    right: 18px;
    bottom: 12px;
    display: none;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
  }
  #jump.visible { display: block; }

  /* Timeline blocks */
  .user-msg {
    margin: 4px 0 12px auto;
    max-width: 85%;
    width: fit-content;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--bg-block);
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .assistant { margin: 6px 0 10px; word-break: break-word; }
  .assistant .tail { white-space: pre-wrap; }
  .assistant p { margin: 0 0 8px; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant ul, .assistant ol { margin: 0 0 8px; padding-left: 22px; }
  .assistant h1, .assistant h2, .assistant h3, .assistant h4 { margin: 12px 0 6px; line-height: 1.3; }
  .assistant h1 { font-size: 1.3em; } .assistant h2 { font-size: 1.18em; } .assistant h3 { font-size: 1.06em; }
  .assistant a { color: var(--accent); }
  .assistant blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border-strong); color: var(--fg-muted); }
  .assistant table { border-collapse: collapse; margin: 0 0 8px; }
  .assistant th, .assistant td { border: 1px solid var(--border); padding: 3px 8px; }
  .assistant code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-block); padding: 1px 4px; border-radius: 4px; }
  .codeblock { position: relative; margin: 0 0 8px; }
  .codeblock pre {
    margin: 0;
    padding: 10px 12px;
    background: #11111b;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-x: auto;
  }
  .codeblock pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.45; }
  .codeblock .lang { position: absolute; left: 10px; top: -9px; font-size: 10px; color: var(--fg-muted); background: var(--bg-alt); padding: 0 4px; }
  .codeblock .copy {
    position: absolute; right: 6px; top: 6px;
    font-size: 11px; padding: 2px 8px; opacity: 0;
    transition: opacity 0.12s;
  }
  .codeblock:hover .copy, .codeblock .copy.done { opacity: 1; }

  details.thinking { margin: 4px 0 8px; color: var(--thinking); font-size: 13px; }
  details.thinking summary { cursor: pointer; user-select: none; font-style: italic; }
  details.thinking .body { white-space: pre-wrap; padding: 4px 0 0 14px; border-left: 2px solid var(--border); margin-top: 4px; }

  details.tool {
    margin: 6px 0;
    border: 1px solid var(--border);
    border-left: 3px solid var(--tool);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  details.tool.error { border-left-color: var(--err); }
  details.tool.done { border-left-color: var(--result); }
  details.tool summary {
    cursor: pointer;
    user-select: none;
    padding: 5px 10px;
    display: flex;
    gap: 8px;
    align-items: baseline;
    list-style: none;
  }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary::before { content: '\25B8'; color: var(--fg-muted); font-size: 10px; }
  details.tool[open] summary::before { content: '\25BE'; }
  .tool-name { font-weight: 600; color: var(--tool); font-family: var(--mono); font-size: 12.5px; }
  details.tool.done .tool-name { color: var(--result); }
  details.tool.error .tool-name { color: var(--err); }
  .tool-brief { color: var(--fg-muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .tool-badge { font-size: 11px; color: var(--warn); white-space: nowrap; }
  .tool-body { padding: 0 10px 8px; }
  .tool-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); margin: 6px 0 3px; }
  .tool-body pre {
    margin: 0;
    padding: 6px 8px;
    background: var(--bg-alt);
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 12px;
    max-height: 320px;
    overflow: auto;
  }
  .tool-body pre.err { color: var(--err); }

  /* Subagent block nested in an Agent tool card */
  details.subagent {
    margin: 6px 0 2px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 5px;
    background: var(--bg-alt);
    font-size: 12.5px;
  }
  details.subagent.done { border-left-color: var(--result); }
  details.subagent.failed { border-left-color: var(--err); }
  details.subagent.stopped { border-left-color: var(--fg-muted); }
  details.subagent summary {
    cursor: pointer; user-select: none; list-style: none;
    padding: 4px 8px; display: flex; gap: 8px; align-items: baseline;
  }
  details.subagent summary::-webkit-details-marker { display: none; }
  details.subagent summary::before { content: '\25B8'; color: var(--fg-muted); font-size: 10px; }
  details.subagent[open] summary::before { content: '\25BE'; }
  .sa-label { font-weight: 600; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  details.subagent.done .sa-label { color: var(--result); }
  details.subagent.failed .sa-label { color: var(--err); }
  .sa-desc { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sa-state { font-size: 11px; color: var(--fg-muted); white-space: nowrap; font-family: var(--mono); }
  details.subagent.running .sa-state { color: var(--accent); }
  .sa-latest { padding: 0 8px 4px 22px; color: var(--fg-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sa-body { padding: 2px 8px 6px 22px; }
  .sa-tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0; }
  .sa-tool { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--tool); }
  .sa-tool.done { color: var(--result); } .sa-tool.error { color: var(--err); }
  .sa-text { white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 240px; overflow: auto; margin-top: 4px; }

  .note { color: var(--fg-muted); font-size: 12px; margin: 6px 0; }
  .note.warn { color: var(--warn); }
  .error-block {
    margin: 6px 0;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--err);
    background: rgba(243, 139, 168, 0.08);
    color: var(--err);
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  /* Legacy pi blocks */
  .block { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--border-strong); background: var(--bg-block); }
  .block .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; opacity: 0.85; }
  .block pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 13px; }
  .block.tool { border-color: var(--tool); } .block.tool_result { border-color: var(--result); }
  .block.thinking { color: var(--thinking); font-style: italic; background: transparent; }

  /* Activity bar */
  .activity {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--bg-block);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg-muted);
    font-size: 12px;
    font-family: var(--mono);
  }
  .activity.visible { display: flex; }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
  .activity.waiting .activity-dot { background: var(--warn); }
  .activity.done .activity-dot { animation: none; background: var(--result); opacity: 0.6; }
  .activity.failed .activity-dot { animation: none; background: var(--err); }
  .activity.stopped .activity-dot { animation: none; background: var(--fg-muted); }
  .activity.done .activity-label, .activity.stopped .activity-label { color: var(--fg-muted); }
  .activity-label { color: var(--fg); font-weight: 600; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }

  /* Runtime request panel */
  #request-panel {
    display: none;
    border: 1px solid var(--warn);
    border-radius: 8px;
    background: var(--bg-block);
    padding: 10px 12px;
    max-height: 45vh;
    overflow-y: auto;
  }
  #request-panel.visible { display: block; }
  .rq-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .rq-title { font-weight: 600; }
  .rq-count { color: var(--fg-muted); font-size: 12px; margin-left: auto; }
  .rq-desc { color: var(--fg-muted); font-size: 12.5px; margin-bottom: 6px; }
  .rq-salient {
    margin: 0 0 8px;
    padding: 6px 8px;
    background: var(--bg-alt);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow: auto;
  }
  .rq-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .rq-actions input[type=text], .rq-other input {
    flex: 1;
    min-width: 160px;
    padding: 6px 8px;
    background: var(--bg-input);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 13px;
  }
  .rq-question { margin-bottom: 10px; }
  .rq-qhead { display: flex; gap: 8px; align-items: baseline; margin-bottom: 5px; }
  .rq-chip { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--bg); background: var(--accent); border-radius: 4px; padding: 1px 5px; }
  .rq-hint { color: var(--fg-muted); font-size: 11px; }
  .rq-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .rq-options button { text-align: left; }
  .rq-options button .sub { display: block; font-size: 11px; color: var(--fg-muted); }
  .rq-options button.selected { border-color: var(--accent); background: rgba(137, 180, 250, 0.18); }
  .rq-other { margin-top: 6px; display: none; }
  .rq-other.visible { display: flex; }
  .rq-sending { color: var(--fg-muted); font-size: 12px; }

  /* Composer */
  /* Composer (T3 Code layout): the message box full width on top, a
     toolbar of compact chips below it with Send/Stop on the right. */
  #composer { display: flex; flex-direction: column; gap: 6px; }
  #prompt {
    width: 100%;
    min-height: 36px;
    max-height: 200px;
    padding: 8px 10px;
    background: var(--bg-input);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13.5px;
    resize: none;
  }
  #prompt:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  #toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #toolbar .tb-chips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
  #toolbar .tb-send { display: flex; gap: 6px; margin-left: auto; }
  #toolbar .tb-send button { padding: 5px 14px; }
  .chip svg, #mode svg, #review svg { width: 12px; height: 12px; flex: none; }
  button {
    padding: 7px 14px;
    background: var(--bg-block);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  button:hover { background: var(--border); }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: var(--err); color: var(--bg); border-color: var(--err); }
  button.danger:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Permission mode chip (left of Send) and its menu */
  .mode-wrap { position: relative; display: none; }
  .mode-wrap.visible { display: block; }
  #mode { padding: 4px 8px; font-family: var(--mono); font-size: 12px; color: var(--fg-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  #mode[data-mode=acceptEdits] { color: var(--accent); border-color: var(--accent); }
  #mode[data-mode=plan] { color: var(--result); border-color: var(--result); }
  #mode[data-mode=auto] { color: var(--warn); border-color: var(--warn); }
  #mode[data-mode=dontAsk], #mode[data-mode=bypassPermissions] { color: var(--err); border-color: var(--err); }
  #mode.pending { opacity: 0.65; }
  #mode-menu {
    display: none;
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    min-width: 190px;
    padding: 4px;
    background: var(--bg-alt);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    z-index: 10;
  }
  #mode-menu.visible { display: block; }
  #mode-menu button { display: flex; width: 100%; gap: 8px; border: none; background: transparent; text-align: left; font-size: 12.5px; padding: 5px 8px; }
  #mode-menu button:hover { background: var(--bg-block); }
  #mode-menu .mark { width: 12px; color: var(--accent); }
  #mode-menu .hint { padding: 4px 8px 2px; color: var(--fg-muted); font-size: 11px; white-space: nowrap; }

  /* Model, effort and checkout chips (TRU-143); menus like the mode chip's */
  .chip-wrap { position: relative; display: none; }
  .chip-wrap.visible { display: block; }
  .chip { padding: 4px 8px; font-family: var(--mono); font-size: 12px; color: var(--fg-muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 5px; }
  .chip .lbl { overflow: hidden; text-overflow: ellipsis; }
  .chip.pending { opacity: 0.65; }
  .chip.locked { cursor: default; }
  .chip.locked:hover { background: var(--bg-block); }
  .chip-menu {
    display: none;
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    min-width: 210px;
    max-height: 320px;
    overflow-y: auto;
    padding: 4px;
    background: var(--bg-alt);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    z-index: 10;
  }
  .chip-menu.visible { display: block; }
  .chip-menu button { display: flex; width: 100%; gap: 8px; border: none; background: transparent; text-align: left; font-size: 12.5px; padding: 5px 8px; align-items: baseline; }
  .chip-menu button:hover { background: var(--bg-block); }
  .chip-menu .mark { width: 12px; flex: none; color: var(--accent); }
  .chip-menu .sub { color: var(--fg-muted); font-size: 11px; margin-left: auto; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .chip-menu .hint { padding: 4px 8px 2px; color: var(--fg-muted); font-size: 11px; white-space: nowrap; }
  .chip-menu .section { padding: 6px 8px 2px; color: var(--fg-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; border-top: 1px solid var(--border); margin-top: 4px; }
  .chip-menu .section:first-child { border-top: none; margin-top: 0; }
  .chip-menu button:disabled { opacity: 0.45; }

  /* Review… button and popover (left of the mode chip) */
  .review-wrap { position: relative; display: none; }
  .review-wrap.visible { display: block; }
  #review { padding: 4px 8px; font-family: var(--mono); font-size: 12px; color: var(--fg-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
  #review-pop {
    display: none;
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    width: 340px;
    padding: 10px 12px;
    background: var(--bg-alt);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    z-index: 10;
    font-size: 12.5px;
  }
  #review-pop.visible { display: block; }
  #review-pop .rv-title { font-weight: 600; margin-bottom: 6px; }
  #review-pop .rv-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  #review-pop .rv-row input[type=text], #review-pop textarea, #review-pop select {
    flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px;
    background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 5px; font-family: inherit;
  }
  #review-pop textarea { width: 100%; resize: vertical; min-height: 44px; }
  #review-pop label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
  #review-pop .rv-hint { color: var(--fg-muted); font-size: 11px; margin: 0 0 4px 22px; }
  #review-pop .rv-hint.warn { color: var(--warn); }
  #review-pop .rv-label { color: var(--fg-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 3px; }
  #review-pop .rv-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }

  /* Delegation cards (Codex review / consult, TRU-142) */
  details.dlg {
    margin: 8px 0;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  details.dlg.completed { border-left-color: var(--result); }
  details.dlg.failed, details.dlg.interrupted { border-left-color: var(--err); }
  details.dlg.cancelled, details.dlg.dismissed { border-left-color: var(--fg-muted); }
  details.dlg.flash { outline: 1px solid var(--accent); }
  details.dlg > summary {
    cursor: pointer; user-select: none; list-style: none;
    padding: 6px 10px; display: flex; gap: 8px; align-items: baseline;
  }
  details.dlg > summary::-webkit-details-marker { display: none; }
  details.dlg > summary::before { content: '\25B8'; color: var(--fg-muted); font-size: 10px; }
  details.dlg[open] > summary::before { content: '\25BE'; }
  .dlg-kind { font-weight: 600; color: var(--accent); font-size: 12.5px; white-space: nowrap; }
  details.dlg.completed .dlg-kind { color: var(--result); }
  details.dlg.failed .dlg-kind, details.dlg.interrupted .dlg-kind { color: var(--err); }
  .dlg-what { flex: 1; min-width: 0; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlg-state { font-family: var(--mono); font-size: 11.5px; color: var(--fg-muted); white-space: nowrap; }
  details.dlg.running .dlg-state, details.dlg.requested .dlg-state { color: var(--accent); }
  .dlg-body { padding: 0 10px 8px 22px; }
  .dlg-line { color: var(--fg-muted); font-size: 12px; margin: 2px 0 6px; }
  .dlg-activity { font-family: var(--mono); font-size: 11.5px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlg-banner { margin: 4px 0 6px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--warn); color: var(--warn); font-size: 12px; }
  .dlg-error { margin: 4px 0 6px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--err); color: var(--err); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
  .dlg-summary { margin: 4px 0 6px; white-space: pre-wrap; word-break: break-word; }
  .dlg-findings { list-style: none; margin: 4px 0; padding: 0; }
  .dlg-finding { display: flex; gap: 6px; align-items: flex-start; padding: 4px 0; border-top: 1px solid var(--border); }
  .dlg-finding:first-child { border-top: none; }
  .dlg-finding input { margin-top: 3px; }
  .dlg-fmain { flex: 1; min-width: 0; }
  .dlg-ftitle { font-weight: 600; }
  .dlg-fid { font-family: var(--mono); font-size: 11.5px; color: var(--fg-muted); }
  .sev { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; color: var(--bg); background: var(--fg-muted); }
  .sev.P0 { background: var(--err); } .sev.P1 { background: var(--tool); } .sev.P2 { background: var(--warn); } .sev.P3 { background: var(--border-strong); color: var(--fg); }
  .dlg-loc { font-family: var(--mono); font-size: 11.5px; color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  .dlg-fbody { color: var(--fg-muted); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .dlg-section { margin: 6px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-muted); }
  .dlg-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .dlg-actions button { padding: 4px 10px; font-size: 12px; }
  .dlg-actions .dlg-note { color: var(--fg-muted); font-size: 11.5px; }

  /* Agent roster: live subagents and delegations (above the composer) */
  #roster { display: none; flex-direction: column; gap: 2px; padding: 4px 6px; background: var(--bg-block); border: 1px solid var(--border); border-radius: 8px; max-height: 132px; overflow-y: auto; }
  #roster.visible { display: flex; }
  .ro-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; font-family: var(--mono); color: var(--fg-muted); cursor: pointer; padding: 1px 4px; border-radius: 4px; }
  .ro-row:hover { background: var(--border); }
  .ro-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .ro-row.done .ro-dot { animation: none; background: var(--result); }
  .ro-row.failed .ro-dot { animation: none; background: var(--err); }
  .ro-row.queued .ro-dot { animation: none; background: var(--fg-muted); }
  .ro-name { color: var(--fg); white-space: nowrap; }
  .ro-what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ro-meta { white-space: nowrap; }
  .ro-x { border: none; background: transparent; padding: 0 4px; font-size: 12px; color: var(--fg-muted); }
  .ro-x:hover { color: var(--fg); background: transparent; }

  /* highlight.js tokens (Catppuccin Mocha) */
  .hljs-keyword, .hljs-selector-tag, .hljs-built_in { color: #cba6f7; }
  .hljs-string, .hljs-attr-value, .hljs-template-string { color: #a6e3a1; }
  .hljs-number, .hljs-literal { color: #fab387; }
  .hljs-comment, .hljs-quote { color: #6c7086; font-style: italic; }
  .hljs-title, .hljs-title.function_, .hljs-section { color: #89b4fa; }
  .hljs-type, .hljs-title.class_ { color: #f9e2af; }
  .hljs-attr, .hljs-attribute, .hljs-property { color: #89dceb; }
  .hljs-variable, .hljs-params { color: #f2cdcd; }
  .hljs-meta, .hljs-symbol { color: #f5c2e7; }
  .hljs-addition { color: #a6e3a1; } .hljs-deletion { color: #f38ba8; }
  .hljs-regexp, .hljs-link { color: #f5c2e7; }

</head>
<body>
  <div id="timeline-wrap">
    <div id="messages"></div>
    <button id="jump">&darr; Latest</button>
  </div>
  <div id="activity" class="activity">
    <span class="activity-dot"></span>
    <span class="activity-label">Starting</span>
    <span class="activity-meta"></span>
  </div>
  <div id="request-panel"></div>
  <div id="roster"></div>
  <div id="composer">
    <textarea id="prompt" placeholder="Message Claude... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <div id="toolbar">
      <div class="tb-chips">
        <div class="review-wrap">
          <div id="review-pop"></div>
          <button id="review" title="Ask a Claude subagent or Codex to review this checkout, or consult them">Review / Consult…</button>
        </div>
        <div class="chip-wrap" id="model-wrap">
          <div class="chip-menu" id="model-menu"></div>
          <button class="chip" id="model" title="Model"></button>
        </div>
        <div class="chip-wrap" id="effort-wrap">
          <div class="chip-menu" id="effort-menu"></div>
          <button class="chip" id="effort" title="Effort and context window"></button>
        </div>
        <div class="mode-wrap">
          <div id="mode-menu"></div>
          <button id="mode" title="Permission mode (Shift+Tab in the message box cycles)"></button>
        </div>
        <div class="chip-wrap" id="checkout-wrap">
          <div class="chip-menu" id="checkout-menu"></div>
          <button class="chip" id="checkout"></button>
        </div>
      </div>
      <div class="tb-send">
        <button id="submit" class="primary">Send</button>
        <button id="stop" class="danger" disabled>Stop</button>
      </div>
    </div>
  </div>
<script>
(function () {
  'use strict';
  // The Rust side calls window.__setTabId(N) when an agent tab is activated.
  // Every IPC message carries it so Rust routes to the right tab.
  // `permissionMode` is the Claude tab's configured mode (null for other
  // backends); the replayed buffer's ready/permission_mode_changed events
  // override it. `composer` (null for other backends) is the Claude tab's
  // configured {model, effort, checkout}; replayed model_changed /
  // effort_changed events override the first two.
  window.__currentTabId = null;
  window.__setTabId = function (id, permissionMode, composer) {
    window.__currentTabId = id;
    resetMode(permissionMode == null ? null : permissionMode);
    // Only Claude tabs have a permission mode, and only they can review.
    setReviewAvailable(permissionMode != null);
    resetComposerChips(composer || null);
  };

  const messagesEl = document.getElementById('messages');
  const jumpBtn = document.getElementById('jump');
  const promptEl = document.getElementById('prompt');
  const submitBtn = document.getElementById('submit');
  const stopBtn = document.getElementById('stop');
  const panelEl = document.getElementById('request-panel');
  const activityEl = document.getElementById('activity');
  const activityLabelEl = activityEl.querySelector('.activity-label');
  const activityMetaEl = activityEl.querySelector('.activity-meta');

  const MAX_TOOL_OUTPUT = 20000;

  // ---- state -------------------------------------------------------------
  let busy = false;           // a turn is in flight
  let replaying = false;      // __replay is feeding the buffer
  let follow = true;          // live-follow: stick to the bottom
  let segment = null;         // current assistant text segment
  let thinking = null;        // current thinking block
  const items = new Map();    // tool_use id -> card state
  const pending = new Map();  // request_id -> {tool_use_id, kind, sending}

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Chip glyphs (inline SVG, currentColor).
  const ICONS = {
    model: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0.8l1.7 4.6 4.7 1.6-4.7 1.7L8 13.4 6.3 8.7 1.6 7l4.7-1.6z"/></svg>',
    lock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></svg>',
    folder: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3.4l1.6 1.7h5.6c.7 0 1.2.5 1.2 1.2v6.4c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z"/></svg>',
    gauge: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 11.5a5.5 5.5 0 1 1 11 0"/><path d="M8 11.5l2.6-3.4"/></svg>',
    review: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4l3.6 3.6"/></svg>',
  };
  function setChip(btn, icon, text) {
    btn.innerHTML = (ICONS[icon] || '') + '<span class="lbl">' + escapeHtml(text) + '</span>';
  }
  function postIpc(payload) {
    if (!window.ipc || typeof window.ipc.postMessage !== 'function') return;
    window.ipc.postMessage(JSON.stringify(Object.assign({}, payload, { tabId: window.__currentTabId })));
  }

  // ---- scrolling ---------------------------------------------------------
  function atBottom() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
  }
  messagesEl.addEventListener('scroll', () => {
    follow = atBottom();
    jumpBtn.classList.toggle('visible', !follow);
  });
  let scrollQueued = false;
  function scrollIfFollowing() {
    if (replaying || !follow || scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => {
      scrollQueued = false;
      if (follow) messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }
  jumpBtn.addEventListener('click', () => {
    follow = true;
    jumpBtn.classList.remove('visible');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
  function append(node) {
    messagesEl.appendChild(node);
    scrollIfFollowing();
    return node;
  }

  // ---- markdown ----------------------------------------------------------
  const hasMarked = typeof window.marked !== 'undefined';
  const hasHljs = typeof window.hljs !== 'undefined';
  function highlight(code, lang) {
    if (hasHljs && lang && hljs.getLanguage(lang)) {
      try { return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch (e) { console.error('highlight failed', e); }
    }
    return escapeHtml(code);
  }
  if (hasMarked) {
    marked.use({
      gfm: true,
      // Single newlines are hard breaks: slash-command replies (`/model`,
      // `/help`) are plain multi-line text, and streamed prose never wraps.
      breaks: true,
      renderer: {
        // Agent output is untrusted: raw HTML is shown as text.
        html(html) { return escapeHtml(html); },
        code(code, info) {
          const lang = (info || '').trim().split(/\s+/)[0] || '';
          return '<div class="codeblock">' + (lang ? '<span class="lang">' + escapeHtml(lang) + '</span>' : '') +
            '<button class="copy" type="button">Copy</button><pre><code class="hljs">' + highlight(code, lang) + '</code></pre></div>';
        },
        link(href, title, text) {
          if (!/^(https?:|mailto:)/i.test(href || '')) return text;
          return '<a href="' + escapeHtml(href) + '"' + (title ? ' title="' + escapeHtml(title) + '"' : '') + '>' + text + '</a>';
        },
        // No remote fetches from the chat: images render as links.
        image(href, title, text) {
          if (!/^https?:/i.test(href || '')) return escapeHtml(text || '');
          return '<a href="' + escapeHtml(href) + '">' + escapeHtml(text || href) + '</a>';
        },
      },
    });
  }
  function renderMarkdown(src) {
    if (!hasMarked) return '<p style="white-space:pre-wrap">' + escapeHtml(src) + '</p>';
    try { return marked.parse(src); } catch (e) {
      console.error('markdown render failed', e);
      return '<p style="white-space:pre-wrap">' + escapeHtml(src) + '</p>';
    }
  }

  // Copy buttons and links (delegated).
  function copyText(text, btn) {
    const done = () => { btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1200); };
    const fallback = () => {
      const ta = el('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { console.error('copy failed', e); }
      ta.remove();
      if (ok) done(); else btn.textContent = 'Copy failed';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }
  document.addEventListener('click', (e) => {
    const copy = e.target.closest('.codeblock .copy');
    if (copy) {
      const code = copy.parentElement.querySelector('code');
      copyText(code ? code.textContent : '', copy);
      return;
    }
    const a = e.target.closest('a');
    if (a) {
      e.preventDefault();
      const href = a.getAttribute('href') || '';
      if (/^https?:/i.test(href)) postIpc({ type: 'open_url', url: href });
    }
  });

  // ---- assistant text segments -------------------------------------------
  // Streamed text is rendered as markdown only up to the last newline; the
  // unfinished line shows as plain text until it completes.
  function renderSegment(final) {
    if (!segment) return;
    const raw = segment.raw;
    const cut = final ? raw.length : raw.lastIndexOf('\n') + 1;
    if (cut !== segment.renderedUpTo) {
      segment.mdEl.innerHTML = renderMarkdown(raw.slice(0, cut));
      segment.renderedUpTo = cut;
    }
    segment.tailEl.textContent = raw.slice(cut);
    scrollIfFollowing();
  }
  function textDelta(text) {
    if (!segment) {
      endThinking();
      const root = append(el('div', 'assistant'));
      segment = { raw: '', renderedUpTo: -1, mdEl: root.appendChild(el('div')), tailEl: root.appendChild(el('span', 'tail')), queued: false };
    }
    segment.raw += text;
    if (replaying) return; // rendered once at segment end
    if (!segment.queued) {
      segment.queued = true;
      const s = segment;
      requestAnimationFrame(() => { s.queued = false; if (segment === s) renderSegment(false); });
    }
  }
  function endSegment() {
    if (!segment) return;
    renderSegment(true);
    segment = null;
  }

  // ---- thinking ----------------------------------------------------------
  function thinkingDelta(text) {
    endSegment();
    if (!text) return; // redacted thinking: activity bar only
    if (!thinking) {
      const d = append(el('details', 'thinking'));
      d.appendChild(el('summary', null, 'Thinking'));
      thinking = { details: d, body: d.appendChild(el('div', 'body')) };
    }
    thinking.body.textContent += text;
    scrollIfFollowing();
  }
  function endThinking() { thinking = null; }

  // ---- tool cards --------------------------------------------------------
  function salient(name, input) {
    if (!input || typeof input !== 'object') return '';
    switch (name) {
      case 'Bash': return input.command || '';
      case 'Read': case 'Write': case 'Edit': case 'MultiEdit': return input.file_path || '';
      case 'NotebookEdit': return input.notebook_path || '';
      case 'Grep': case 'Glob': return input.pattern || '';
      case 'WebFetch': return input.url || '';
      case 'WebSearch': return input.query || '';
      case 'Task': case 'Agent': return input.description || '';
      default: return '';
    }
  }
  function itemStarted(id, kind) {
    endSegment(); endThinking();
    const name = kind && kind.name ? kind.name : 'tool';
    const d = append(el('details', 'tool running'));
    d.dataset.toolId = id;
    d.open = true;
    const summary = d.appendChild(el('summary'));
    summary.appendChild(el('span', 'tool-name', name));
    const brief = summary.appendChild(el('span', 'tool-brief'));
    const badge = summary.appendChild(el('span', 'tool-badge'));
    const body = d.appendChild(el('div', 'tool-body'));
    body.appendChild(el('div', 'tool-label', 'Input'));
    const inputEl = body.appendChild(el('pre'));
    const item = { card: d, name, brief, badge, body, inputEl, outputEl: null, raw: '', input: kind && kind.input, sub: null };
    items.set(id, item);
    if (item.input && Object.keys(item.input).length) showInput(item, item.input);
    if (name === 'Agent' || name === 'Task') ensureSubagent(item);
    setActivity('Calling ' + name);
  }
  function showInput(item, input) {
    item.input = input;
    item.brief.textContent = salient(item.name, input);
    item.inputEl.textContent = JSON.stringify(input, null, 2);
    if (item.sub) renderSubagent(item.sub);
  }
  function itemInputDelta(id, partial) {
    const item = items.get(id);
    if (!item) return;
    item.raw += partial;
    if (item.raw.trimEnd().endsWith('}')) {
      try { showInput(item, JSON.parse(item.raw)); setActivity('Running ' + item.name); } catch (e) { /* still streaming */ }
    }
  }
  function itemCompleted(id, output, isError) {
    const item = items.get(id);
    if (!item) return;
    item.card.classList.remove('running');
    item.card.classList.add(isError ? 'error' : 'done');
    item.body.appendChild(el('div', 'tool-label', isError ? 'Error' : 'Result'));
    let text = output || '(no output)';
    if (text.length > MAX_TOOL_OUTPUT) text = text.slice(0, MAX_TOOL_OUTPUT) + '\n… (' + (output.length - MAX_TOOL_OUTPUT) + ' more characters)';
    item.outputEl = item.body.appendChild(el('pre', isError ? 'err' : null, text));
    item.badge.textContent = '';
    item.card.open = false;
    // A foreground subagent is done when its Agent call returns, even if
    // the harness sent no completion of its own. A background one only
    // finishes on its own completion event.
    if (item.sub && item.sub.state === 'running' && !item.sub.tracked) {
      item.sub.state = isError ? 'failed' : 'done';
      renderSubagent(item.sub);
    }
    setActivity('Thinking');
    scrollIfFollowing();
  }

  // ---- subagents (nested under the parent's Agent tool card) -------------
  // tool_use id of a tool a subagent called -> the root Agent call's id, so
  // permission prompts and nested subagents land in the right block.
  const subTools = new Map();
  function ensureSubagent(item) {
    if (item.sub) return item.sub;
    const d = el('details', 'subagent running');
    item.card.insertBefore(d, item.body);
    const summary = d.appendChild(el('summary'));
    const sub = {
      details: d,
      item,
      label: summary.appendChild(el('span', 'sa-label', 'Subagent')),
      desc: summary.appendChild(el('span', 'sa-desc')),
      stateEl: summary.appendChild(el('span', 'sa-state')),
      latestEl: item.card.insertBefore(el('div', 'sa-latest'), item.body),
      toolsEl: null, textEl: null,
      state: 'running', tracked: false, waiting: false,
      tools: [], text: '', model: null,
      // Roster: elapsed is only known for subagents seen live.
      startMs: replaying ? null : Date.now(), endMs: null, tokens: null, fromReplay: replaying,
    };
    subagents.push(sub);
    const body = d.appendChild(el('div', 'sa-body'));
    sub.toolsEl = body.appendChild(el('div', 'sa-tools'));
    sub.textEl = body.appendChild(el('div', 'sa-text'));
    item.sub = sub;
    renderSubagent(sub);
    return sub;
  }
  function lastLine(text) {
    const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
    const line = lines.length ? lines[lines.length - 1] : '';
    return line.length > 200 ? line.slice(0, 200) + '…' : line;
  }
  function renderSubagent(sub) {
    const input = sub.item.input || {};
    const parts = [];
    if (input.description) parts.push(input.description);
    if (input.subagent_type) parts.push(input.subagent_type);
    const model = input.model || sub.model;
    if (model) parts.push(model);
    sub.desc.textContent = parts.join(' · ');
    const states = { running: sub.waiting ? 'waiting for approval' : 'running', done: 'done', failed: 'failed', stopped: 'stopped' };
    const n = sub.tools.length;
    sub.stateEl.textContent = states[sub.state] + (n ? ' · ' + n + (n === 1 ? ' tool' : ' tools') : '');
    sub.details.className = 'subagent ' + sub.state;
    sub.latestEl.textContent = lastLine(sub.text);
    sub.latestEl.style.display = sub.text ? '' : 'none';
    if (sub.state !== 'running' && sub.startMs != null && sub.endMs == null) sub.endMs = Date.now();
    if (!replaying) renderRoster();
  }
  function subagentEvent(parentId, ev) {
    const rootId = items.has(parentId) ? parentId : subTools.get(parentId);
    const item = rootId && items.get(rootId);
    if (!item) { console.warn('subagent event for unknown tool call', parentId, ev); return; }
    const sub = ensureSubagent(item);
    const d = ev.data;
    switch (ev.type) {
      case 'turn_started':
        sub.tracked = true;
        sub.state = 'running';
        if (d && d.model) sub.model = d.model;
        break;
      case 'turn_completed': {
        const st = (d && d.status && d.status.state) || 'completed';
        sub.state = st === 'completed' ? 'done' : st === 'interrupted' ? 'stopped' : 'failed';
        const usage = (d && d.usage) || {};
        const tokens = typeof usage.output_tokens === 'number' ? usage.output_tokens : (typeof usage.total_tokens === 'number' ? usage.total_tokens : null);
        if (tokens != null) sub.tokens = tokens;
        if (st === 'failed' && d.status.message) sub.text += (sub.text ? '\n' : '') + d.status.message;
        break;
      }
      case 'text_delta':
        sub.text += d;
        sub.textEl.textContent = sub.text;
        setActivity('Subagent responding');
        break;
      case 'thinking_delta':
        setActivity('Subagent thinking');
        break;
      case 'item_started': {
        const name = d.kind && d.kind.name ? d.kind.name : 'tool';
        subTools.set(d.id, rootId);
        const chip = sub.toolsEl.appendChild(el('span', 'sa-tool', name));
        const toolInput = (d.kind && d.kind.input) || {};
        chip.title = salient(name, toolInput) || name;
        // The roster shows what the subagent is doing as the CLI does: the
        // tool call's own description, else its salient argument.
        const desc = toolInput.description || salient(name, toolInput);
        sub.tools.push({ id: d.id, name, chip, desc: desc ? name + ': ' + desc : name });
        // Separate the text before and after each tool call.
        if (sub.text && !sub.text.endsWith('\n')) sub.text += '\n';
        setActivity('Subagent: ' + name);
        break;
      }
      case 'item_completed': {
        const tool = sub.tools.find((t) => t.id === d.id);
        if (tool) tool.chip.classList.add(d.is_error ? 'error' : 'done');
        break;
      }
      case 'subagent_event':
        // A subagent's own subagent rolls up into the same block.
        subagentEvent(d.parent_tool_use_id, d.event);
        return;
      default:
        break;
    }
    renderSubagent(sub);
    scrollIfFollowing();
  }

  // ---- activity bar ------------------------------------------------------
  const activity = { startMs: 0, label: '', timer: null, frozenMs: null, tokens: null, cost: null, timed: true };
  function fmtDur(ms) {
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + 's';
    return Math.floor(s / 60) + 'm ' + Math.floor(s % 60) + 's';
  }
  function paintActivity() {
    activityLabelEl.textContent = activity.label;
    const parts = [];
    if (activity.timed) parts.push(fmtDur(activity.frozenMs != null ? activity.frozenMs : Date.now() - activity.startMs));
    if (activity.tokens) parts.push('↓ ' + activity.tokens + ' tokens');
    if (activity.cost != null) parts.push('$' + activity.cost.toFixed(4) + ' session');
    activityMetaEl.textContent = parts.join(' · ');
  }
  function startActivity(label) {
    activity.startMs = Date.now();
    activity.frozenMs = null; activity.tokens = null; activity.cost = null;
    activity.timed = !replaying;
    activity.label = label;
    activityEl.className = 'activity visible';
    if (activity.timer) clearInterval(activity.timer);
    activity.timer = replaying ? null : setInterval(paintActivity, 500);
    paintActivity();
  }
  function setActivity(label, cls) {
    if (!busy) return;
    activity.label = label;
    activityEl.className = 'activity visible' + (cls ? ' ' + cls : '');
    paintActivity();
  }
  function finishActivity(label, cls, tokens, cost) {
    if (activity.timer) { clearInterval(activity.timer); activity.timer = null; }
    activity.frozenMs = Date.now() - activity.startMs;
    if (typeof tokens === 'number') activity.tokens = tokens;

        const picked = (q.options || []).map((o) => o.label).filter((l) => st.selected.has(l));
        if (st.otherOn && st.other.trim()) picked.push(st.other.trim());
        answers[q.question || ''] = picked.join(', ');
      });
      answer(requestId, { kind: 'answer_question', answers });
    });
    const deny = actions.appendChild(el('button', null, 'Dismiss'));
    deny.addEventListener('click', () => answer(requestId, { kind: 'deny', message: 'The user declined to answer.' }));
    refresh();
    return frag;
  }
  function renderPanel() {
    panelEl.innerHTML = '';
    const first = pending.entries().next();
    if (first.done) {
      panelEl.classList.remove('visible');
    } else {
      const [requestId, req] = first.value;
      panelEl.appendChild(req.kind.type === 'question' ? renderQuestion(requestId, req) : renderPermission(requestId, req));
      panelEl.classList.add('visible');
    }
    refreshComposer();
  }
  function runtimeRequest(d) {
    endSegment();
    pending.set(d.request_id, { tool_use_id: d.tool_use_id, kind: d.kind, sending: false });
    const item = items.get(d.tool_use_id);
    if (item) item.badge.textContent = d.kind.type === 'question' ? 'waiting for your answer' : 'waiting for approval';
    const subRoot = subTools.has(d.tool_use_id) && items.get(subTools.get(d.tool_use_id));
    if (subRoot && subRoot.sub) { subRoot.sub.waiting = true; renderSubagent(subRoot.sub); }
    setActivity(d.kind.type === 'question' ? 'Waiting for your answer' : 'Waiting for approval: ' + (d.kind.tool_name || ''), 'waiting');
    renderPanel();
  }
  function runtimeResolved(requestId) {
    const req = pending.get(requestId);
    if (!req) return;
    pending.delete(requestId);
    const item = items.get(req.tool_use_id);
    if (item) { item.badge.textContent = ''; setActivity('Running ' + item.name); }
    const subRoot = subTools.has(req.tool_use_id) && items.get(subTools.get(req.tool_use_id));
    if (subRoot && subRoot.sub) { subRoot.sub.waiting = false; renderSubagent(subRoot.sub); }
    renderPanel();
  }
  function clearPending() {
    for (const req of pending.values()) {
      const item = items.get(req.tool_use_id);
      if (item) item.badge.textContent = '';
      const subRoot = subTools.has(req.tool_use_id) && items.get(subTools.get(req.tool_use_id));
      if (subRoot && subRoot.sub) { subRoot.sub.waiting = false; renderSubagent(subRoot.sub); }
    }
    pending.clear();
    renderPanel();
  }

  // ---- harness events ----------------------------------------------------
  function note(text, cls) { append(el('div', 'note' + (cls ? ' ' + cls : ''), text)); }
  function errorBlock(text) { endSegment(); append(el('div', 'error-block', text)); }

  function harnessEvent(ev) {
    const d = ev.data;
    switch (ev.type) {
      case 'ready':
        confirmMode(d.permission_mode);
        if (Array.isArray(d.models) && d.models.length) { chips.models = d.models; renderModel(); renderEffort(); }
        note(d.session_id ? 'Resumed Claude session ' + d.session_id.slice(0, 8) + ' · permission mode ' + (d.permission_mode || '?')
                          : 'Claude session ready · permission mode ' + (d.permission_mode || '?'));
        break;
      case 'turn_started':
        // Claude starts a turn on its own when a background subagent
        // finishes; show it as running like any other turn.
        if (!busy) { endSegment(); endThinking(); setBusy(true); startActivity('Starting'); }
        break;
      case 'subagent_event':
        subagentEvent(d.parent_tool_use_id, d.event);
        break;
      case 'text_delta':
        endThinking();
        textDelta(d);
        setActivity('Responding');
        break;
      case 'thinking_delta':
        thinkingDelta(d);
        setActivity('Thinking');
        break;
      case 'item_started':
        itemStarted(d.id, d.kind);
        break;
      case 'item_input_delta':
        itemInputDelta(d.id, d.partial_json);
        break;
      case 'item_completed':
        itemCompleted(d.id, d.output, d.is_error);
        break;
      case 'runtime_request':
        runtimeRequest(d);
        break;
      case 'runtime_request_resolved':
        runtimeResolved(d.request_id);
        break;
      case 'turn_completed': {
        endSegment(); endThinking();
        clearPending();
        const st = d.status || {};
        const tokens = d.usage && typeof d.usage.output_tokens === 'number' ? d.usage.output_tokens : null;
        if (st.state === 'completed') finishActivity('Done', 'done', tokens, d.cost_usd);
        else if (st.state === 'interrupted') { finishActivity('Interrupted', 'stopped', tokens, d.cost_usd); note('Interrupted', 'warn'); }
        else { finishActivity('Failed', 'failed', tokens, d.cost_usd); errorBlock(st.message || 'Turn failed'); }
        setBusy(false);
        break;
      }
      case 'permission_mode_changed':
        confirmMode(d);
        note('Permission mode · ' + modeLabel(d));
        break;
      case 'model_changed':
        confirmModel(d);
        note('Model · ' + modelLabel(d));
        break;
      case 'effort_changed':
        confirmEffort(d.effort, d.applied);
        note('Effort · ' + effortLabel(d.effort) + (d.effort == null && d.applied ? ' (' + d.applied + ')' : ''));
        break;
      case 'error':
        // A rejected or undeliverable mode, model or effort change
        // surfaces as an error.
        clearPendingMode();
        clearPendingChips();
        errorBlock(d);
        break;
      case 'process_exited':
        endSegment(); endThinking();
        clearPending();
        clearPendingMode();
        clearPendingChips();
        if (busy) finishActivity('Claude exited', 'failed');
        note('Claude process exited' + (d.code != null ? ' (code ' + d.code + ')' : '') + '. The next message resumes the session.');
        setBusy(false);
        break;
      default:
        console.warn('unknown harness event', ev);
    }
  }

  // ---- legacy (pi) events --------------------------------------------------
  function addBlock(kind, label, body) {
    const block = el('div', 'block ' + kind);
    if (label) block.appendChild(el('div', 'label', label));
    block.appendChild(el('pre', null, body));
    append(block);
  }
  function legacyEvent(event) {
    const t = event.type;
    if (t === 'turn_end') {
      const msg = event.message;
      if (msg && Array.isArray(msg.content)) {
        for (const block of msg.content) {
          if (block.type === 'thinking' && block.thinking) addBlock('thinking', 'Thinking', block.thinking);
          else if (block.type === 'text' && block.text) { textDelta(block.text); endSegment(); }
          else if (block.type === 'toolCall' || block.type === 'tool_use') addBlock('tool', 'Tool · ' + (block.name || 'tool'), block.arguments ? JSON.stringify(block.arguments, null, 2) : '');
        }
      }
      if (Array.isArray(event.toolResults)) {
        for (const r of event.toolResults) addBlock('tool_result', 'Tool result', typeof r === 'string' ? r : JSON.stringify(r, null, 2));
      }
    } else if (t === 'done') {
      finishActivity('Done', 'done'); setBusy(false);
    } else if (t === 'stopped') {
      finishActivity('Stopped', 'stopped'); setBusy(false);
    } else if (t === 'error') {
      errorBlock(event.message || JSON.stringify(event));
      finishActivity('Failed', 'failed'); setBusy(false);
    }
    // session / agent_start / turn_start and anything else: quiet.
  }

  // ---- entry points (called from Rust) -------------------------------------
  window.__appendEvent = function (event) {
    if (!event || typeof event !== 'object') return;
    try {
      if (event.kind === 'harness') { harnessEvent(event.event); return; }
      if (event.kind === 'delegation_anchor') { delegationAnchor(event.delegation_id); return; }
      if (event.kind === 'delegation') { delegationEvent(event); return; }
      if (event.type === 'user_prompt') {
        endSegment(); endThinking();
        append(el('div', 'user-msg', event.text || ''));
        follow = true;
        setBusy(true);
        startActivity('Starting');
        return;
      }
      legacyEvent(event);
    } catch (e) {
      console.error('render failed for event', event, e);
      errorBlock('Chat view could not render an event: ' + e);
    }
  };

  // Replay a tab's buffered conversation in one go.
  window.__replay = function (events) {
    replaying = true;
    try {
      for (const ev of events) window.__appendEvent(ev);
      endSegment();
    } finally {
      replaying = false;
    }
    if (busy) {
      // Turn still running: keep the label, restart a live clock.
      activity.timed = false;
      if (!activity.timer) activity.timer = setInterval(paintActivity, 500);
    }
    paintActivity();
    renderRoster();
    follow = true;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  window.__resetConversation = function () {
    messagesEl.innerHTML = '';
    segment = null; thinking = null;
    items.clear(); pending.clear(); subTools.clear();
    resetDelegations();
    if (activity.timer) { clearInterval(activity.timer); activity.timer = null; }
    activityEl.className = 'activity';
    follow = true;
    jumpBtn.classList.remove('visible');
    renderPanel();
    setBusy(false);
  };

  window.__focusComposer = function () { promptEl.focus(); };

  refreshComposer();
  promptEl.focus();
})();
</script>
</body>
</html>
