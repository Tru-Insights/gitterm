name: CI

on:
  push:
    branches: [ master, main, v3, v4, v5, v6 ]
  # No pull_request trigger: PRs merge on the full local gate (macOS), and
  # CI runs once on the target branch after merge as the backstop.
  # workflow_dispatch runs it on demand for any branch.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Fmt / Clippy / Test
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout iced_term_fork (sibling directory)
      run: |
        cd ..
        if [ ! -d "iced_term_fork" ]; then
          git clone https://github.com/Tru-Insights/iced_term.git iced_term_fork
        fi

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: "gitterm-v6-ci"

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Clippy
      run: cargo clippy -- -D warnings

    - name: Clippy (excalidraw)
      run: cargo clippy --features excalidraw -- -D warnings

    - name: Tests
      run: cargo test

    - name: Tests (excalidraw)
      run: cargo test --features excalidraw

    - name: GPUI release and bundle (macOS only)
      run: |
        tests/check-gpui-deps.sh
        scripts/check-gpui-deps.sh
        scripts/cargo.sh fmt --manifest-path gpui/Cargo.toml --all -- --check
        scripts/cargo.sh clippy --manifest-path gpui/Cargo.toml --workspace --locked --all-targets -- -D warnings
        scripts/bundle-gpui.sh

    - name: GPUI tests (macOS only)
      run: scripts/cargo.sh test --manifest-path gpui/Cargo.toml --workspace --locked
